{% extends "base.html" %}

{% block title %}{{ titulo }} | Mini Abarrotes{% endblock %}

{% block content %}

<section class="formulario-contenedor">

    <div class="pagina-titulo">
        <div>
            <h2>{{ titulo }}</h2>
            <p class="texto-secundario">
                Introduce la información del producto.
            </p>
        </div>
    </div>

    <form method="POST" class="formulario">

        <div class="campo">
            <label for="nombre">Nombre del producto</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="120"
                placeholder="Ej. Coca-Cola 600 ml"
                value="{{ producto.nombre if producto else '' }}"
                required
            >
        </div>

        <div class="campo">
            <label for="categoria">Categoría</label>

            <input
                type="text"
                id="categoria"
                name="categoria"
                maxlength="80"
                placeholder="Ej. Bebidas"
                value="{{ producto.categoria or '' if producto else '' }}"
            >
        </div>

        <div class="campo">
            <label for="precio">Precio de venta (MXN)</label>

            <input
                type="number"
                id="precio"
                name="precio"
                min="0"
                max="99999999.99"
                step="0.01"
                placeholder="0.00"
                value="{{ producto.precio if producto else '' }}"
                required
            >
        </div>

        <div class="campo">
            <label for="stock">Existencias</label>

            <input
                type="number"
                id="stock"
                name="stock"
                min="0"
                step="1"
                placeholder="0"
                value="{{ producto.stock if producto else '0' }}"
                required
            >
        </div>

        <div class="formulario-acciones">

            <button type="submit" class="boton boton-principal">
                Guardar producto
            </button>

            <a href="{{ url_for('productos') }}"
               class="boton boton-secundario">
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
